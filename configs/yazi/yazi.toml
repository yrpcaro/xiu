# Xiu yazi: keymap, layout, and plugin wiring.
# Clean, modern, minimal aesthetic matching Xiu shell.

[manager]
ratio = [1, 3, 4]
sort_by = "alphabetical"
sort_sensitive = false
sort_reverse = false
sort_dir_first = true
linemode = "size_and_mtime"
show_hidden = false
show_symlink = true
scrolloff = 5

prepend_keymap = [
    # ── smart navigation ──────────────────────────────────────────────
    # one key opens files AND enters directories (official plugin)
    { on = "o", run = "plugin smart-enter", desc = "Open the file or enter the directory" },
    # continuous filter, auto-entering unique dirs (official plugin)
    { on = "q", run = "plugin smart-filter", desc = "Filter as you type" },
    # skip through directories that hold a single subdirectory
    { on = "H", run = "plugin bypass", desc = "Skip single-child directories" },

    # ── git ───────────────────────────────────────────────────────────
    # file-list linemode showing git status
    { on = "g", run = "plugin git -- vcs-files", desc = "Show git status in the file list" },

    # ── file operations ───────────────────────────────────────────────
    { on = "c", run = "plugin smart-paste", desc = "Paste into the hovered directory" },
    { on = "C", run = "plugin compress", desc = "Compress the selection into an archive" },
    { on = "X", run = "plugin chmod", desc = "Change the selection's permissions" },
    { on = "D", run = "plugin diff", desc = "Diff selected against hovered" },

    # ── mount / devices ───────────────────────────────────────────────
    { on = "M", run = "plugin mount", desc = "Mount, unmount and eject disks" },
    # Android over MTP: mounts under ~/mnt/phone via the rice's helper
    # script (simple-mtpfs), then jumps the manager there. Toggling unmounts.
    { on = "<A-p>", run = 'shell --confirm "xiu mount-phone"', desc = "Mount/unmount the Android phone" },
    { on = ["g", "p"], run = "cd ~/mnt/phone", desc = "Go to the phone mount" },

    # ── power-user tails ──────────────────────────────────────────────
    # drag and drop (ripdrag): drag selected or hovered files out, or open drop target
    { on = "<C-d>", run = 'shell --confirm "ripdrag -x -i -T \"$@\""', desc = "Drag and drop selected files" },
    { on = "<C-n>", run = 'shell --confirm "ripdrag -x -i -T \"$0\""', desc = "Drag and drop hovered file" },
    { on = "<C-y>", run = 'shell --confirm "ripdrag -d \"$PWD\""', desc = "Drop files into current folder" },
    # recover from the trash (pairs with the rm→rip graveyard's `rip -u`)
    { on = "u", run = "plugin restore", desc = "Restore a trashed file" },
    # open a shell in the current directory (fish)
    { on = "!", run = 'shell --confirm "fish"', desc = "Open a shell here" },
    # file copy/paste through the system clipboard
    { on = "y", run = ["yank", "plugin clipboard"], desc = "Yank and copy to system clipboard" },
    { on = "p", run = "plugin clipboard -- paste", desc = "Paste from system clipboard" },
    # lazygit in the current directory
    { on = ";", run = 'shell --confirm "lazygit"', desc = "Lazygit here" },

    # ── media previews are keyed in the preview block ─────────────────
    { on = ["g", "r"], run = 'shell --confirm "cd $(git root) || true"', desc = "Go to the git root" },
]

[preview]
tab_size = 2
max_width = 1000
max_height = 1000
image_filter = "triangle"
image_quality = 85
sixel_fraction = 15

[opener]
edit = [
    { run = '${EDITOR:-nvim} "$@"', block = true, desc = "Edit" },
]
play = [
    { run = 'mpv "$@"', orphan = true, desc = "Play" },
]
open = [
    { run = 'xdg-open "$@"', desc = "Open" },
]
