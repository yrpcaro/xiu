# Xiu foot terminal. All colors live in colors.ini — the [colors-dark]
# section's only source — which ships with the washi fallback and is rewritten
# by the wallpaper pipeline (wallcolors.py) on every change, so new terminals
# always open in the current scheme. The include is a [main]-level directive:
# it must stay above the section headers to be read as an include at all.
include=~/.config/foot/colors.ini

font=JetBrainsMono Nerd Font:size=12
vertical-letter-offset=1
shell=fish

pad=14x12 center

[cursor]
style=block
blink=no

[mouse]
hide-when-typing=yes

[key-bindings]
clipboard-paste=Control+v
