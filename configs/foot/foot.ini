# Xiu foot terminal. The palette include at the bottom is rewritten by the
# wallpaper pipeline on every change, so new terminals always open in the
# current scheme; the built-in fallback below is the warm washi palette.

font=JetBrainsMono Nerd Font:size=12
vertical-letter-offset=1
shell=fish

pad=14x12 center

[cursor]
style=block
blink=no
color=e0563b fff6f0

[mouse]
hide-when-typing=yes

[colors]
alpha=0.85
background=1c120c
foreground=e6d6cb
selection-background=594636
selection-foreground=fff6f0
regular0=2e231b
regular1=c0442b
regular2=8a9a5b
regular3=d89a5b
regular4=6f8da0
regular5=b06a78
regular6=7fa89a
regular7=e6d6cb
bright0=594636
bright1=e0563b
bright2=a8b56e
bright3=f0b85e
bright4=8fa9bb
bright5=d08a96
bright6=9fc3b4
bright7=fff6f0

[bind]
ctrl+v=paste-from-clipboard

# Palette written by wallcolors.py; new terminals pick it up.
include=~/.config/foot/colors.ini
