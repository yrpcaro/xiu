# Xiu MPV configuration: High Performance, uosc interface, system look & feel

# ── General ───────────────────────────────────────────────────────────
save-position-on-quit=yes
keep-open=yes
cursor-autohide=1000
cursor-autohide-fs-only=no
autofit-larger=85%x85%
geometry=50%:50%

# ── Video & Rendering ──────────────────────────────────────────────────
vo=gpu
hwdec=auto-safe
gpu-api=auto
gpu-context=wayland,auto

# Balanced high-performance scaling
scale=spline36
cscale=spline36
dscale=mitchell
scale-antiring=0.0
cscale-antiring=0.0
dither-depth=auto
correct-downscaling=yes
linear-downscaling=yes
sigmoid-upscaling=yes

# Debanding (disabled by default for smooth lag-free playback and zero GPU lockup)
deband=no

# ── UI & OSD (Configured for uosc) ────────────────────────────────────
# Disable native OSC and OSD bar so uosc handles the interface
osc=no
osd-bar=no
border=no
osd-font="Inter"
osd-font-size=28
osd-color="#fff6f0"
osd-border-color="#160f0a"
osd-border-size=1.5
osd-shadow-offset=1
osd-shadow-color="#000000"

# ── Audio & Subtitles ─────────────────────────────────────────────────
volume=100
volume-max=150
audio-file-auto=fuzzy
audio-pitch-correction=yes

# Subtitle styling matching system aesthetics
sub-auto=fuzzy
sub-font="Inter"
sub-font-size=38
sub-color="#fff6f0"
sub-border-color="#160f0a"
sub-border-size=2.0
sub-shadow-offset=1
sub-shadow-color="#000000"
sub-margin-y=36
slang=en,eng
alang=ja,jp,jpn,en,eng

# ── Cache & Network ───────────────────────────────────────────────────
cache=yes
demuxer-max-bytes=150M
demuxer-max-back-bytes=50M
ytdl-format="bestvideo[height<=?1440]+bestaudio/best"
