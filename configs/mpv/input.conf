# Xiu MPV Keybindings: uosc integration, audio loudnorm normalization filter

# ── uosc navigation & menus ───────────────────────────────────────────
tab         script-binding uosc/toggle-ui
mbtn_right  script-binding uosc/menu
menu        script-binding uosc/menu
s           script-binding uosc/subtitles
a           script-binding uosc/audio
c           script-binding uosc/chapters
p           script-binding uosc/playlist
o           script-binding uosc/open-file

# ── Audio Normalization (EBU R128 loudnorm filter toggle) ─────────────
n           af toggle loudnorm=I=-16:TP=-1.5:LRA=11 ; show-text "Loudnorm normalization: ${af}"

# ── Playback Controls ─────────────────────────────────────────────────
space       cycle pause; script-binding uosc/flash-pause-indicator
f           cycle fullscreen
m           cycle mute
q           quit
Q           quit-watch-later

# ── Seeking ───────────────────────────────────────────────────────────
right       seek 5
left        seek -5
shift+right seek 30
shift+left  seek -30
.           frame-step
,           frame-back-step

# ── Volume ────────────────────────────────────────────────────────────
up          add volume 2; script-binding uosc/flash-volume
down        add volume -2; script-binding uosc/flash-volume
wheel_up    add volume 2; script-binding uosc/flash-volume
wheel_down  add volume -2; script-binding uosc/flash-volume

# ── Speed ─────────────────────────────────────────────────────────────
[           multiply speed 1/1.1; script-binding uosc/flash-speed
]           multiply speed 1.1; script-binding uosc/flash-speed
\           set speed 1.0; script-binding uosc/flash-speed

# ── SponsorBlock ──────────────────────────────────────────────────────
b           script-binding sponsorblock/sponsorblock-submit
B           script-binding sponsorblock/sponsorblock-toggle
