# The lock's private cava: raw ascii levels on stdout, 12 bars 0-100 at 60fps,
# mono-summed so the bars track what you hear regardless of channel. The
# standalone cava TUI keeps its own ~/.config/cava/config with the palette
# renderer; this one is only read by the lock's Cava singleton via -p.
[general]
mode = normal
framerate = 60
bars = 12
autosens = 0
sensitivity = 5500

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
channels = mono

[smoothing]
noise_reduction = 0.77
