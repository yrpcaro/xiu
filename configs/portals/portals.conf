# Xiu portals: native Hyprland backends for screen capture, gnome-keyring for
# secrets, GTK for everything else. The FileChooser line routes to termfilechooser
# (yazi in foot answers the dialogs) with GTK fallback.
[preferred]
default=gtk
org.freedesktop.impl.portal.FileChooser=termfilechooser;gtk
org.freedesktop.impl.portal.ScreenCast=hyprland
org.freedesktop.impl.portal.Screenshot=hyprland
org.freedesktop.impl.portal.Secret=gnome-keyring
