# Xiu portals: native Hyprland backends for screen capture, the terminal
# file chooser (yazi in foot, via xdg-desktop-portal-termfilechooser),
# gnome-keyring for secrets, GTK for everything else.
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=hyprland
org.freedesktop.impl.portal.Screenshot=hyprland
org.freedesktop.impl.portal.Secret=gnome-keyring
org.freedesktop.impl.portal.FileChooser=termfilechooser
