# Xiu portals: native Hyprland backends for screen capture, gnome-keyring for
# secrets, GTK for everything else. The FileChooser line is deliberately NOT
# here: routing it to termfilechooser when that backend is not installed
# makes file dialogs fail with no fallback at all. The installer's
# wire_portal_chooser adds the routing to the DEPLOYED copy of this file
# only once the backend is present (yazi in foot then answers the dialogs).
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=hyprland
org.freedesktop.impl.portal.Screenshot=hyprland
org.freedesktop.impl.portal.Secret=gnome-keyring
