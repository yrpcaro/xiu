# Xiu tealdeer configuration.
# tealdeer is a fast tldr client in Rust that replaces man pages with
# concise, practical examples styled to match the xiu palette.

[display]
compact = false
use_pager = true
show_title = true

[updates]
auto_update = true
auto_update_interval_hours = 168

[style.description]
foreground = "white"

[style.command_name]
foreground = "red"
bold = true

[style.example_text]
foreground = "green"

[style.example_code]
foreground = "cyan"

[style.example_variable]
foreground = "yellow"
italic = true
