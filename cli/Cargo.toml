[package]
name = "xiu"
version = "0.1.0"
edition = "2021"
description = "Pure Rust system engine for the xiu Wayland desktop environment"
license = "MIT"

[[bin]]
name = "xiu"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
regex = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "2"

[profile.release]
strip = true
lto = true
